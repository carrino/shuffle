name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (bans Math.random in src)
        run: npm run lint
      - name: Tests + Phase 1 validation gate
        run: npm test
      - name: Generate validation report
        run: npm run validate:report
      - name: Build site (includes results/validation.json)
        run: npm run build
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: results/validation.json
      - name: Upload built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Publishes the built site to the gh-pages branch (Pages source:
  # "Deploy from a branch" → gh-pages /(root)). PR previews live under
  # pr-preview/ on the same branch — see pr-preview.yml — so that
  # directory is excluded from the clean step.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages-push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
